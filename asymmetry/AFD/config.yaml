# ==============================================================================
# vLLM Ascend 自动化基准测试配置文件
# ==============================================================================
# 修改此文件后运行脚本即可，无需修改脚本代码

# ------------------------------------------------------------------------------
# 通用配置 (attn.sh 和 ffn.sh 共用)
# ------------------------------------------------------------------------------
common:
  # 模型路径
  model_path: "/home/weight/DSV2LiteWeight"
  # 日志根目录
  log_dir: "/home/ttg_p2p/scripts/afd/log"
  # 网络配置
  master_addr: "80.48.33.145"
  master_port: "29500"
  network_interface: "enp209s0f3"
  # AFD通信端口
  afd_port: 29455
  # 专家并行配置 (支持多个值，会遍历测试)
  expert_per_rank:
    - 4

# ------------------------------------------------------------------------------
# Attention 服务配置 (attn.sh)
# ------------------------------------------------------------------------------
attention:
  # HTTP服务端口
  port: 8008

# ------------------------------------------------------------------------------
# 性能分析器配置
# ------------------------------------------------------------------------------
profiler:
  # Model Runner Profiler
  model_runner:
    enable: 1
    wait: 2
    warmup: 1
    active: 10
    repeat: 1
    skip_first: 10000
    dir:  "/home/ttg_p2p/scripts/afd/attn_profile"
  # FFN Profiler
  ffn:
    enable: 1
    wait: 2
    warmup: 1
    active: 20
    repeat: 1
    skip_first: 10000
    dir: "/home/ttg_p2p/scripts/afd/ffn_profile"

# ------------------------------------------------------------------------------
# 环境配置
# ------------------------------------------------------------------------------
environment:
  pythonpath: "/home/ttg_p2p/sources/jiusi-vllm-ascend:/home/ttg_p2p/sources/jiusi-vllm"
  hccl_buffsize: 2048
  ascend_toolkit_path: "/usr/local/Ascend/ascend-toolkit/latest/opp/vendors/CAM/bin/set_env.bash"

# ------------------------------------------------------------------------------
# 基准测试配置 (run_auto_benchmark.sh)
# ------------------------------------------------------------------------------
benchmark:
  # batch size 列表
  bsize_list: "48 64 80 96"
  # attention 卡数数组
  attn_arr:
    - 8
  # ffn 卡数数组
  ffn_arr:
    - 4
  # 输入长度列表
  input_list: "2048 4096 8192 16384 32768"
  # micro batch size 列表
  ubatch_list: "2"
  # 数据量倍数
  data_multiplier: 16
  # 起始设备号
  start_device: 0

# ------------------------------------------------------------------------------
# ais_bench 配置
# ------------------------------------------------------------------------------
ais_bench:
  config_py: "/home/ttg_p2p/scripts/benchmark/ais_bench/benchmark/configs/datasets/synthetic/synthetic_gen_string.py"
  model_py: "/home/ttg_p2p/scripts/benchmark/ais_bench/benchmark/configs/models/vllm_api/vllm_api_stream_chat.py"
  # 预热配置
  warmup_request_count: 1536
  warmup_max_out_len: 2
  # 正式测试配置
  formal_max_out_len: 1024

# ------------------------------------------------------------------------------
# Profile 解析配置
# ------------------------------------------------------------------------------
profile:
  parser_script: "profileabc.py"
